name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Change wrapper permissions and Build
      run: |
        if [ -f gradlew ]; then
          chmod +x gradlew
          ./gradlew build
        elif [ -f android/gradlew ]; then
          cd android
          chmod +x gradlew
          ./gradlew build
        else
          echo "Gradlew file not found anywhere!"
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AmbuTrack-debug-apk
        path: "**/build/outputs/apk/debug/app-debug.apk"

