name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Fix Android Structure on Server
      run: |
        mkdir -p app/src/main/java/com/example/ambutrack
        mkdir -p app/src/main/res/values
        [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
        [ -f MainActivity.java ] && mv MainActivity.java app/src/main/java/com/example/ambutrack/
        [ -f styles.xml ] && mv styles.xml app/src/main/res/values/
        gradle wrapper
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AmbuTrack-debug-apk
        path: "**/build/outputs/apk/debug/*.apk"

