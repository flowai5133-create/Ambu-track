name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Auto Find Project and Build
      run: |
        GRADLE_DIR=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs dirname)
        echo "Project found in directory: $GRADLE_DIR"
        cd "$GRADLE_DIR"
        gradle wrapper
        chmod +x gradlew
        ./gradlew build

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AmbuTrack-debug-apk
        path: "**/build/outputs/apk/debug/app-debug.apk"
